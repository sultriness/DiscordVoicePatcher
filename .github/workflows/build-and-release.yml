name: Build Test Prerelease

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node-gyp and dependencies
        run: |
          npm install -g node-gyp@11.5.0
          npm install --ignore-scripts

      - name: Build native module
        run: |
          node-gyp rebuild --target=37.6.0 --arch=x64 --dist-url=https://electronjs.org/headers

      - name: Smoke test exports
        run: |
          node -e "const p=require('./build/Release/patcher.node'); if(typeof p.applyPatches!=='function'||typeof p.revertPatches!=='function') process.exit(1); console.log(Object.keys(p).sort().join(','))"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patcher-artifacts
          path: |
            build/Release/patcher.node
            patcher.ini

  prerelease:
    needs: build
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: patcher-artifacts

      - name: Get short commit hash
        shell: bash
        run: echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ env.commit_hash }}
          target_commitish: ${{ github.sha }}
          name: Test Release ${{ env.commit_hash }}
          prerelease: true
          files: |
            build/Release/patcher.node
            patcher.ini
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
